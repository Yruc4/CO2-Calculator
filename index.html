<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO2 Emission Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">CO2 Calculator</h1>
        <p class="header__subtitle">Calculate and track your carbon footprint based on your transportation choices</p>
    </header>

    <main class="main">
        <form class="calculator-form" id="calculator-form">
            <div class="form__group">
                <label for="origin" class="form__label">Origin</label>
                <input 
                    type="text" 
                    id="origin" 
                    class="form__input" 
                    list="clients-list"
                    required
                >
            </div>

            <div class="form__group">
                <label for="destination" class="form__label">Destination</label>
                <input 
                    type="text" 
                    id="destination" 
                    class="form__input" 
                    list="clients-list"
                    required
                >
            </div>

            <datalist id="clients-list"></datalist>

            <div class="form__group">
                <label for="distance" class="form__label">Distance (km)</label>
                <input 
                    type="number" 
                    id="distance" 
                    class="form__input" 
                    readonly
                >
                <p class="form__helper-text">Distance will be automatically filled</p>
            </div>

            <div class="form__group form__group--checkbox">
                <input 
                    type="checkbox" 
                    id="manual-distance" 
                    class="form__checkbox"
                >
                <label for="manual-distance" class="form__label form__label--checkbox">Insert distance manually</label>
            </div>

            <fieldset class="form__fieldset">
                <legend class="form__legend">Transport Mode</legend>
                <div class="transport-grid">
                    <label class="transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="bicycle" 
                            class="transport-option__input"
                        >
                        <span class="transport-option__label">🚴 Bicycle</span>
                    </label>
                    <label class="transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="car" 
                            class="transport-option__input" 
                            checked
                        >
                        <span class="transport-option__label">🚗 Car</span>
                    </label>
                    <label class="transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="bus" 
                            class="transport-option__input"
                        >
                        <span class="transport-option__label">🚌 Bus</span>
                    </label>
                    <label class="transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="truck" 
                            class="transport-option__input"
                        >
                        <span class="transport-option__label">🚚 Truck</span>
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="form__button">Calculate Emission</button>
        </form>

        <section id="results" class="results hidden">
            <div id="results-content" class="results__content"></div>
        </section>

        <section id="comparison" class="comparison hidden">
            <div id="comparison-content" class="comparison__content"></div>
        </section>

        <section id="carbon-credits" class="carbon-credits hidden">
            <div id="carbon-credits-content" class="carbon-credits__content"></div>
        </section>
    </main>

        <section id="chosen-method-comparison" class="chosen-method-comparison hidden">
            <div id="chosen-method-comparison-content" class="chosen-method-comparison__content"></div>
        </section>

        <section id="transport-comparison" class="transport-comparison hidden">
            <div id="transport-comparison-content" class="transport-comparison__content"></div>
        </section>
        
    <footer class="footer">
        <p class="footer__credits">Developed by Murilo S. | Project GitHub Copilot</p>
    </footer>

    <script src="js/routes-data.js"></script>
    <script src="js/config.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
